[pytest]
# Run `pytest` (no arguments) from the repo root to collect the dipole safety suite.
# On worker1 use the documented interpreter, which is the only one with pytest + nds2:
#   /var/lib/cds-conda/base/envs/cds-testing/bin/python3 -m pytest -q
testpaths =
    scripts/dipole/tests

# scripts/dipole/tests/conftest.py already inserts scripts/dipole on sys.path, but
# setting it here too means `pytest` works from any cwd.
pythonpath =
    scripts/dipole

python_files = test_*.py
addopts = -ra --strict-markers

# cameras/test_*.py are NOT in testpaths: they import the Thorlabs/IDS SDKs and only
# run inside the `thorcam` conda env on worker1. Collect them explicitly when needed:
#   pytest cameras/
markers =
    loopback: live hardware self-test via ACTS_8_8->LOS_IN1 loopback (worker1 only, needs the front end)
    control: negative control - proves a safety check actually rejects bad input rather than passing everything
